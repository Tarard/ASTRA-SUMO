name: codex-export-snapshot

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/workflow-evidence-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repository snapshot
        run: |
          tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/torii-sumo-snapshot.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: torii-sumo-snapshot
          path: ${{ runner.temp }}/torii-sumo-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
