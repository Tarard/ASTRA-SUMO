[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-sumo"
version = "1.3.0"
description = "ASTRA agent plugin for evidence-aware Eclipse SUMO, OSM cleanup, and public-data corridor digital twins."
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Operating System :: Microsoft :: Windows"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "ASTRA contributors" }
]
dependencies = [
  "anyio>=4.0",
  "mcp[cli]>=1.0.0,<2",
  "numpy>=1.26",
  "osmium>=4.3,<5",
  "Pillow>=10.0",
  "pyproj>=3.6",
  "pydantic>=2.7",
  "pywin32>=306; platform_system == 'Windows'",
  "scipy>=1.11",
  "shapely>=2.1,<3",
  "sumolib>=1.27.1",
  "traci>=1.20",
  "tzdata>=2024.1; platform_system == 'Windows'"
]

[project.optional-dependencies]
native = ["eclipse-sumo==1.27.1; platform_system == 'Windows'"]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
  "ruff>=0.15"
]

[project.scripts]
astra = "astra_sumo.cli:main"
astra-sumo = "astra_sumo.server:main"
astra-netedit = "astra_sumo.core.netedit:main"
torii = "astra_sumo.cli:main"
torii-sumo = "astra_sumo.server:compat_main"
torii-netedit = "astra_sumo.core.netedit:main"

[tool.setuptools.packages.find]
where = ["plugins/astra-sumo/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/astra-sumo/src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"experiments/junction_aggregation_strategy_probe.py" = ["E402"]
"plugins/astra-sumo/scripts/export_corridor_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/export_composite_benchmark_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/export_held_out_review_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/export_stage1_review_ready_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/export_official_sumo_benchmark_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/export_ood_benchmark_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/export_plainxml_normalization_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/normalize_osm_plainxml.py" = ["E402"]
"plugins/astra-sumo/scripts/export_synthetic_benchmark_schema.py" = ["E402"]
"plugins/astra-sumo/scripts/evaluate_held_out_review.py" = ["E402"]
"plugins/astra-sumo/scripts/build_held_out_corpus.py" = ["E402"]
"plugins/astra-sumo/scripts/build_held_out_corridor_evidence.py" = ["E402"]
"plugins/astra-sumo/scripts/freeze_held_out_corpus.py" = ["E402"]
"plugins/astra-sumo/scripts/run_official_sumo_benchmark.py" = ["E402"]
"plugins/astra-sumo/scripts/run_ood_benchmark.py" = ["E402"]
"plugins/astra-sumo/scripts/run_composite_fault_benchmark.py" = ["E402"]
